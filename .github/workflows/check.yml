# The guards in `npm run check` only protect the product if they actually
# run. `check:verdicts` holds the published verdict thresholds to the ones
# the landing page shows visitors; `check:identification` runs the real scan
# engine against mocked Google Lens responses and fails if the product in
# the photo is not the product that comes back.
name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
